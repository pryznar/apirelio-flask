[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apirelio-flask"
version = "0.1.0"
description = "Fail-safe customer-aware API analytics integration for Flask."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Apirelio" }]
keywords = ["apirelio", "flask", "api", "analytics", "observability"]
dependencies = [
  "apirelio>=0.2.0,<0.3.0",
  "flask>=2.3,<4",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Flask",
  "Framework :: Flask :: 2",
  "Framework :: Flask :: 3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://apirelio.com/docs/python/flask"
Documentation = "https://apirelio.com/docs/python/flask"
Repository = "https://github.com/pryznar/apirelio-flask"
Issues = "https://github.com/pryznar/apirelio-flask/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.10,<2", "pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apirelio_flask = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Current Flask/Click type definitions use Python 3.10 syntax. Runtime
# compatibility with Python 3.9 is covered by the CI interpreter matrix.
python_version = "3.10"
strict = true
files = ["src", "tests"]
